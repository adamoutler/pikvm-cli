[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pikvm-aio"
version = "0.1.5"
description = "Asynchronous Python client library and CLI for PiKVM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Adam Outler", email = "adamoutler@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.9.0",
    "pyotp>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "aioresponses>=0.7.6",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
pikvm-cli = "pikvm_aio.cli:main"

[project.urls]
Homepage = "https://github.com/adamoutler/pikvm-aio"
Repository = "https://github.com/adamoutler/pikvm-aio"
Issues = "https://github.com/adamoutler/pikvm-aio/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pikvm_aio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --cov=pikvm_aio --cov-report=term-missing --cov-report=xml -m 'not live'"
markers = [
    "live: Integration tests that interact with live PiKVM hardware (run with -m live)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
