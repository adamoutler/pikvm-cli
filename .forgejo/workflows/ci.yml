name: CI / CD

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  packages: write
  contents: write

jobs:
  test:
    name: Run Tests & Quality Checks
    runs-on: ubuntu-latest
    container:
      image: python:3.12
    steps:
      - name: Setup and Checkout
        run: |
          apt-get update && apt-get install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          git init
          git remote add origin "https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@git.adamoutler.com/${GITHUB_REPOSITORY}.git"
          git fetch origin "${GITHUB_SHA}"
          git reset --hard FETCH_HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install '.[dev]'

      - name: Run Ruff Lint
        run: |
          ruff check src tests

      - name: Run Mypy Type Check
        run: |
          mypy src

      - name: Run Tests with Coverage
        run: |
          pytest -v --cov=pikvm_aio --cov-report=term-missing --cov-fail-under=85

      - name: Build and Validate Distribution
        run: |
          python -m build
          twine check dist/*
